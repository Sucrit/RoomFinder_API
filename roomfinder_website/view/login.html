<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../assets/style/login.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="../assets/images/appLogo2.png" alt="UPang Logo" class="logo">
            <h1 class="site-title">UPang Room Search</h1>
        </div>

        <form class="login-form" id="loginForm">
            <h2>Admin Login</h2>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" required>
                    <svg id="eye-icon" class="eye-icon" onclick="togglePassword()" width="20" height="20" viewBox="0 0 24 24" fill="none" 
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
                <p id="error-message" class="error-message"></p>
            </div>

            <button type="submit">Login</button>

            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>
        </form>
    </div>

    <div id="successModal" class="modal">
        <div class="modal-content">
            <p id="successMessage">Login successful!</p>
            <button onclick="closeModal()">OK</button>
        </div>
    </div>

    <script src="../model/admin.js"></script>
    <script src="../viewmodel/admin.js"></script>
    <script>
        // ViewModel instance
        const viewModel = new AdminViewModel();

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Set data in the ViewModel
            viewModel.setEmail(email);
            viewModel.setPassword(password);

            // Call ViewModel's loginUser method
            viewModel.loginUser().then(result => {
                if (result.status === 'success') {
                    document.getElementById('successMessage').textContent = result.message;
                    document.getElementById('successModal').style.display = 'block';
                } else {
                    document.getElementById('error-message').textContent = result.message;
                }
            });
        });

        // Toggle password visibility
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            const type = passwordField.type === 'password' ? 'text' : 'password';
            passwordField.type = type;

            // Change icon based on visibility
            if (type === 'password') {
                eyeIcon.setAttribute('stroke', 'currentColor');
            } else {
                eyeIcon.setAttribute('stroke', '#4CAF50'); // change icon color when visible
            }
        }

        // Close success modal
        function closeModal() {
            document.getElementById('successModal').style.display = 'none';
        }
    </script>
</body>
</html>
