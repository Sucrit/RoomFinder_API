<section id="room_schedule" class="hidden">
	<div class="topcontainer">
		<h2>Room Schedules</h2>
		<div class="profile-container"></div>
	</div>

	<div class="schedule-content">
		<!-- Floating Search Bar -->
		<div class="search-container">
			<i class="fa fa-search"></i>
			<input
				type="text"
				id="searchInput"
				placeholder="Search here..."
				onkeyup="searchTable()" />
		</div>

		<div class="room-table-container">
			<h2>CITE</h2>
			<div class="table-wrapper-schedule">
				<table class="room-sched">
					<tr>
						<th class="room-name-header">Room Bldg.</th>

						<th class="ongoing-schedule-header">Room Number</th>
						<th class="ongoing-schedule-header">Date and Time</th>
						<th class="status-header">Block</th>
						<th class="action-header">Action</th>
					</tr>

					<tbody class="table-data" align="center"></tbody>
				</table>
			</div>
		</div>
	</div>
	<div class="floating-btn" onclick="openAddRoomForm()">+</div>

	<!-- Add Room Modal -->
	<div id="modal" class="modal">
		<div class="modals">
			<div class="modal-header">
				<h2>Add Schedules</h2>
				<span class="closemodal">&times;</span>
			</div>
			<form
				action="#"
				method="POST"
				class="roomdetails_form"
				id="modal-content ">
				<!-- Block -->
				<label>Block:</label>
				<select name="block">
					<option value="Block 1">1</option>
					<option value="Block 2">2</option>
					<option value="Block 3">3</option>
					<option value="Block 4">4</option>
					<option value="Block 5">5</option>
					<option value="Block 6">6</option>
					<option value="Block 7">7</option>
					<option value="Block 8">8</option>
					<option value="Block 9">9</option>
					<option value="Block 10">10</option></select
				><br />

				<!-- Date -->
				<label>Date</label><br />
				<input type="date" name="date" /><br />

				<!-- Time -->
				<label>Time</label>
				<div class="form-group-horizontal">
					<div class="time">
						<label>Starting Time</label>
						<input type="time" name="timeStart" />
					</div>

					<div class="time">
						<label>Ending Time</label>
						<input type="time" name="timeEnd" />
					</div>
				</div>
				<div class="modal-actions">
					<!-- Submit buttons -->
					<button type="submit" class="backbtn">Exit</button>
					<button type="submit" class="createbtn">Add</button>
				</div>
			</form>
		</div>
	</div>
</section>
