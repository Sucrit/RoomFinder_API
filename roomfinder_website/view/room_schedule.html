<section id="room_schedule" class="hidden">
	<div class="topcontainer">
		<h2>Room Schedules</h2>
		<div class="profile-container"></div>
	</div>

	<div class="schedule-content">
		<!-- Floating Search Bar -->
		<div class="search-container">
			<i class="fa fa-search"></i>
			<input
				type="text"
				id="searchInput"
				placeholder="Search here..."
				onkeyup="searchTable()" />
		</div>

		<div class="room-table-container">
			<h2>CITE</h2>
			<div class="table-wrapper-schedule">
				<table class="room-sched">
					<tr>
						<th class="room-name-header">Room Bldg.</th>

						<th class="ongoing-schedule-header">Room Number</th>
						<th class="ongoing-schedule-header">Date and Time</th>
						<th class="status-header">Block</th>
						<th class="action-header">Action</th>
					</tr>

					<tbody class="table-data" align="center"></tbody>
				</table>
			</div>
		</div>
	</div>
	<div class="floating-btn">+</div>

	<!-- Add Schedule Modal -->
	<div id="modal" class="modal" data-room-id="">
		<div class="modals">
			<div class="modal-header">
				<h2>Add Schedules</h2>
				<span class="closemodal"></span>
			</div>
			<form
				action="#"
				method="POST"
				class="roomdetails_form"
				id="addscheduletoroomform">

				<label>Room Blgd:</label>
				<select name="roomBldg" id="roomBldg">
					
				</select>		
				
				<label>Room Number:</label>
				<select name="roomNumber" id="roomNumber">
					<option value="PTC">PTC</option>
					<option value="ITS">ITS</option>
				</select>

				<label>Block:</label>
				<select name="block">
					<option value="Block 1">1</option>
					<option value="Block 2">2</option>
					<option value="Block 3">3</option>
					<option value="Block 4">4</option>
					<option value="Block 5">5</option>
					<option value="Block 6">6</option>
					<option value="Block 7">7</option>
					<option value="Block 8">8</option>
					<option value="Block 9">9</option>
					<option value="Block 10">10</option>
				</select
				><br />

				<input type="hidden" id="roomscheduleIdField" name="roomscheduleId" value="" />

				<label>Date</label><br />
				<input type="date" name="date" required /><br />

				<label>Time</label>
				<div class="form-group-horizontal">
					<div class="time">
						<label>Starting Time</label><br />
						<input type="time" name="timeStart" required />
					</div>

					<div class="time">
						<label>Ending Time</label><br />
						<input type="time" name="timeEnd" required />
					</div>
				</div>
				<div class="modal-actions">
					<button type="button" class="closeModalBtn">Cancel</button>
					<button type="submit" class="action-btn">Add Schedule</button>
				</div>
			</form>
		</div>
	</div>
</section>
