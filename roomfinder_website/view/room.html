<section id="room" class="hidden">
    <div class="topcontainer">
        <h2>Room Details</h2>
        <div class="profile-container">
        

        </div>
    </div>

    <div class="room-container">

        <div class="room-list">
            <div class="room-header">
                <select class="filter">
                    <option value="all">All</option>
                    <option value="Available">Available</option>
                    <option value="Occupied">Occupied</option>
                    <option value="Closed">Closed</option>
                </select>
                <div class="search-container">
                    <img src="../roomfinder_website/assets/images/web-svg-icons/search-icon.svg" alt="">
                    <input type="text" class="search-bar" placeholder="Search here..." id="roomSearch">
                </div>
            </div>
    
            <div class="table-wrapper">
                <table  class="room-sched">
                    <thead>
                        <tr>
                            <th>Room Building</th>
                            <th>Room Number</th>
                            <th>Ongoing Schedule</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="roomListBody" class="table-data">
                       
                        
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add Room and Schedule Button -->
        <button class="floating-btn">+</button>




        <!-- Add Room Modal -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="closemodal"></span>

                <form id="roomForm" method="POST" class="roomdetails_form">
                    <div>
                        <h2>Room Details</h2>
                    </div>

                    <div class="roomform_container">
                        <div class="form-group">
                            <label>Room Number</label>
                            <input type="number" name="roomNumber" min="1" required /><br />
                        </div>
                        
                        <div class="form-group">
                            <label>Room Bldg.</label>
                            <select name="roomBuilding">
                                <option value="PTC">PTC</option>
                                <option value="ITS">ITS</option>
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Capacity</label>
                            <input type="number" name="capacity" min="1" max="70" value="50" required ><br />
                        </div>

                        <div class="form-group">
                            <label>Room Type</label>
                            <select name="roomType" required >
                                <option value="Lecture Room">Lecture Room</option>
                                <option value="Laboratory Room">Laboratory Room</option>
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Equipment</label>
                            <div class="equipment">
                                <label><input type="checkbox" value="Air Conditioner">Air Conditioner</label>
                                <label><input type="checkbox" value="Monitor">Monitor</label>
                                <label><input type="checkbox" value="Computer">Computer</label>
                                <label><input type="checkbox" value="Whiteboard">Whiteboard</label>
                                <label><input type="checkbox" value="Wi-Fi"> Wi-Fi</label>
                            </div>
                        </div>
                        

                        <div class="form-group">
                            <label>Availability</label>
                            <select name="availability">
                                <option value="Available">Available</option>
                                <option value="Closed">Closed</option>
                            </select><br />
                        </div>
                        
                        <!-- Submit buttons -->
                        <button type="submit" class="createbtn">Create</button>
                        <button type="button" class="backbtn">Back</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Confirmation Modal After Room Creation -->
        <div id="roomCreatedModal" class="modal">
            <div class="modal-content">
                <span class="closemodal"></span>
                <h2>Room Created Successfully!</h2>
                <p>Do you want to add a schedule to this room?</p>
                <button id="addScheduletoRoom" data-room-id="">Add</button>
                <button id="cancelAddSchedule">No, Later</button>
            </div>
        </div>




        <!-- Add Schedule Modal -->
        <div id="addScheduleModal" class="modal" data-room-id="">
            <div class="modal-content">
                <span class="closemodal"></span>
                <form action="#" method="POST" class="roomdetails_form">
                    <div class="roomform_container">
                        <h2>Add Schedules</h2>
                        <div class="form-group">
                            <label>Block:</label>
                            <select name="block">
                                <option value="Block 1">1</option>
                                <option value="Block 2">2</option>
                                <option value="Block 3">3</option>
                                <option value="Block 4">4</option>
                                <option value="Block 5">5</option>
                                <option value="Block 6">6</option>
                                <option value="Block 7">7</option>
                                <option value="Block 8">8</option>
                                <option value="Block 9">9</option>
                                <option value="Block 10">10</option>
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Date</label><br />
                            <input type="date" name="date" required><br />
                        </div>

                        <div class="form-group">
                            <label>Time</label>
                            <div class="form-group-horizontal">
                                <div class="time">
                                    <label>Starting Time</label><br />
                                    <input type="time" name="timeStart" required>
                                </div>

                                <div class="time">
                                    <label>Ending Time</label><br />
                                    <input type="time" name="timeEnd" required>
                                </div>
                            </div>
                        </div>

                        <button type="submit">Add Schedule</button>
                        <button type="button" class="closeModalBtn">Close</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
