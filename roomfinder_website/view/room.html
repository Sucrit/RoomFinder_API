<section id="rooms" class="hidden">
    <div class="topcontainer">
        <h2 style="margin-left: 15px;">Room Details</h2>
        <div class="profile-container">
            <img src="../assets/images/default-profile.png" alt="Profile" class="profile-img">
            <div class="profile-texts">
                <h3 class="profileName"></h3>
                <p class="profileRole"></p>
            </div>
        </div>
    </div>

    <div class="room-container">
        <div class="room-header">
            <input type="text" class="search-bar" placeholder="Search here..." id="roomSearch">
        </div><br />

        <div class="room-table">
            <table>
                <thead>
                    <tr>
                        <th>Room Name</th>
                        <th>Ongoing Schedule</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="roomTableBody">
                    <!-- Dynamic content will be inserted here -->
                </tbody>
            </table>
        </div>

        <!-- Add Room and Schedule -->
        <button class="floating-btn" onclick="openAddRoomModal()">+</button>

        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="closemodal" onclick="closeModal()">&times;</span>

                <form action="#" method="POST" class="roomdetails_form">
                    <div>
                        <h1>ADD ROOM & SCHEDULE</h1>
                        <h2>Room Details</h2>
                    </div>

                    <div class="roomform_container">
                        <div class="form-group">
                            <label>Room Number</label>
                            <select name="roomNumber" id="roomNumberSelect">
                                <!-- Dynamic options will be inserted here -->
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Room Building</label>
                            <select name="roomBuilding" id="roomBuildingSelect">
                                <!-- Dynamic options will be inserted here -->
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Capacity</label>
                            <input type="number" name="capacity" min="1" max="45" required><br />
                        </div>

                        <div class="form-group">
                            <label>Room Type</label>
                            <select name="roomType" id="roomTypeSelect">
                                <!-- Dynamic options will be inserted here -->
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Availability</label>
                            <select name="availability" id="availabilitySelect">
                                <option value="Available">Available</option>
                                <option value="Occupied">Occupied</option>
                                <option value="Closed">Closed</option>
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Equipment</label>
                            <div class="equipment">
                                <!-- Dynamic equipment checkboxes will be inserted here -->
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2>Add Schedules</h2>
                    </div>

                    <div class="roomform_container">
                        <div class="form-group">
                            <label>Block:</label>
                            <select name="block" id="blockSelect">
                                <!-- Dynamic options will be inserted here -->
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Date</label><br />
                            <input type="date" name="date" required><br />
                        </div>

                        <div class="form-group">
                            <label>Time</label>
                            <div class="form-group-horizontal">
                                <div class="time">
                                    <label>Start time</label><br />
                                    <input type="time" name="timeStart" required>
                                </div>

                                <div class="time">
                                    <label>End time</label><br />
                                    <input type="time" name="timeEnd" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Day</label>
                            <select name="day" id="daySelect">
                                <!-- Dynamic options will be inserted here -->
                            </select><br />
                        </div>

                        <button type="submit" class="addanotherbtn">+</button> Add another<br />
                        <button type="submit" class="createbtn">Create</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Edit Room Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="closemodal" onclick="closeEditModal()">&times;</span>

                <form action="#" method="POST" class="roomdetails_form">
                    <div>
                        <h1>EDIT ROOM</h1>
                        <h2>Room Details</h2>
                    </div>

                    <div class="roomform_container">
                        <div class="form-group">
                            <label>Room Number</label>
                            <select name="roomNumber" id="editRoomNumberSelect">
                                <!-- Dynamic options will be inserted here -->
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Room Building</label>
                            <select name="roomBuilding" id="editRoomBuildingSelect">
                                <!-- Dynamic options will be inserted here -->
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Capacity</label>
                            <input type="number" name="capacity" min="1" max="45" required><br />
                        </div>

                        <div class="form-group">
                            <label>Room Type</label>
                            <select name="roomType" id="editRoomTypeSelect">
                                <!-- Dynamic options will be inserted here -->
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Availability</label>
                            <select name="availability" id="editAvailabilitySelect">
                                <option value="Available">Available</option>
                                <option value="Occupied">Occupied</option>
                                <option value="Closed">Closed</option>
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Equipment</label>
                            <div class="equipment">
                                <!-- Dynamic equipment checkboxes will be inserted here -->
                            </div>
                        </div>
                    </div>

                    <div>
                        <h2>Add Schedules</h2>
                    </div>

                    <div class="roomform_container">
                        <div class="form-group">
                            <label>Block:</label>
                            <select name="block" id="editBlockSelect">
                                <!-- Dynamic options will be inserted here -->
                            </select><br />
                        </div>

                        <div class="form-group">
                            <label>Date</label><br />
                            <input type="date" name="date" required><br />
                        </div>

                        <div class="form-group">
                            <label>Time</label>
                            <div class="form-group-horizontal">
                                <div class="time">
                                    <label>Start time</label><br />
                                    <input type="time" name="timeStart" required>
                                </div>

                                <div class="time">
                                    <label>End time</label><br />
                                    <input type="time" name="timeEnd" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Day</label>
                            <select name="day" id="editDaySelect">
                                <!-- Dynamic options will be inserted here -->
                            </select><br />
                        </div>

                        <button type="submit" class="addanotherbtn">+</button> Add another<br />
                        <button type="submit" class="updatebtn">Update</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
