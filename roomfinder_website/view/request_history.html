<section id="request-history" class="hidden">
    <div class="topcontainer">
        <h2 style="margin-left: 15px;">Request History</h2>
        <div class="profile-container">
            <img src="pic/default-profile.jpg" alt="Profile" class="profile-img" id="profileImg">
            <div class="profile-texts">
                <h3 class="profileName">John Doe</h3>
                <p class="profileRole">Administrator</p>
            </div>
        </div>
    </div>
    <table id="request-history-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Room</th>
                <th>Block</th>
                <th>Date & Time</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="history-rows">
            <!-- Dynamically populated rows will go here -->
        </tbody>
    </table>
</section>
