<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>University Room Finder</title>
    <link rel="stylesheet" href="assets/style/home.css"> <!-- Corrected relative path -->
</head>

<body>

   <!-- Navigation Bar -->
   <div class="navbar">
    <div class="logo-container">
        <img src="./assets/images/appLogo.png" alt="UPang Logo" class="logo">
        <span class="roomsearchTxt">UPang Room Search</span>
    </div>

    <!-- Navigation Links -->
    <a href="#" class="nav-item" onclick="showSection('dashboard')">
        <img src="./assets/images/dashboardIcon.png" alt="Dashboard Icon">
        Dashboard
    </a>
    
    <a href="#" class="nav-item" onclick="showSection('room')">
        <img src="./assets/images/room.png" alt="Rooms Icon">
        Rooms
    </a>
    
    <a href="#" class="nav-item" onclick="showSection('account')">
        <img src="./assets/images/account.png" alt="Account Icon">
        Account
    </a>

    <!-- Dropdown Menus for Room Requests and Room Schedules -->
    <div class="dropdown">
        <div class="dropdown-toggle">
            <img src="./assets/images/requestIcon.png" alt="Room Requests Icon">
            Room Request
        </div>
        <div class="dropdown-menu">
            <a href="#" class="nav-item" onclick="showSection('pending_request')">
                Pending Request
            </a>
            <a href="#" class="nav-item" onclick="showSection('request_history')">
                Request History
            </a>
        </div>
    </div>

    <div class="dropdown">
        <div class="dropdown-toggle">
            <img src="assets/images/roomscheduleIcon.png" alt="Room Schedules Icon">
            Room Schedules
        </div>
        <div class="dropdown-menu">
            <a href="#" class="nav-item" onclick="showSection('ongoing_schedule')">
                Ongoing Schedule
            </a>
            <a href="#" class="nav-item" onclick="showSection('room_schedule')">
                Room Schedule
            </a>
        </div>
    </div>

    <a href="./view/login.html" class="logoutBtn">
        <img src="./assets/images/logoutIcon.png" alt="Logout Icon">
        Logout
    </a>
</div>

    <!-- Main Content Section -->
    <main id="content">
        <!-- Content will be dynamically loaded here -->
    </main>

    <script src="./assets/js/router.js"></script> <!-- Your JavaScript file -->

</body>
</html>
