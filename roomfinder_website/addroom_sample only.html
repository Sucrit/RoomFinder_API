<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .roomdetails_form{
            width: 50%;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 10px;
            height: auto;

        }
        .roomdetails_form h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group{
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .form-group label {
            width: 100px;
            font-weight: bold;
        }
        .form-group select, .form-group span, .form-group input, .equipment {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #c6f6d5;
        }
        .equipment label {
            display: inline-flex;
            align-items: center;
            margin-right: 20px;
            margin-right: 20px;
        }

        .roomform_container {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .time{
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            margin-left: 25px;
        }
        .form-group-horizontal {
            margin-top: 30px;
            display: flex;
            justify-content: space-evenly;
            border: solid 1px #ccc;
            padding: 10px;
            border-radius: 5px;
    }
    .createbtn {
        padding: 10px;
        border: none;
        border-radius: 5px;
        background-color: #4CAF50;
        color: white;
        margin-top: 20px;
        cursor: pointer;
        
    }

.addanotherbtn{
    border-radius: 50%;
    background-color: #180a58;
    color: white;
}
    </style>
</head>
<body>
    <form action="#" method="POSt" class="roomdetails_form">
        <div>
            <h2>Room Details</h2>
        </div>
        
        <div class="roomform_container">
        <div class="form-group">
            <label >Room Number</label>
            <select name="roomNumber">
                <option value="PTC 304">PTC 304</option>
                <option value="PTC 403">PTC 403</option>
                <option value="ITS 201">ITS 201</option>
            </select><br/>
        </div>

        <div class="form-group">
            <label >Room Building</label>
            <select name="roomBuilding">
                <option value="PTC">PTC</option>
                <option value="ITS">ITS</option>
            </select><br/>
        </div>

        <div class="form-group">
            <label>Capacity</label>
            <input type="number" name="capacity" min="1" max="45" required><br/>
        </div>

        <div class="form-group">
            <label>Room Type</label>
            <select name="roomType">
                <option value="Lecture Room">Lecture Room</option>
                <option value="Laboratory Room">Laboratory Room</option>
            </select><br/>
        </div>

        <div class="form-group">
            <label>Availability</label>
            <select name="availability">
                <option value="Available">Available</option>
                <option value="Occupied">Occupied</option>
                <option value="Close">Close</option>
            </select><br/>
        </div>

        <div class="form-group">
            <label>Equipment</label>
            <div class="equipment">
                <input type="checkbox" value="outlet"> Outlet</label>
                <input type="checkbox" value="air conditioner"> Air Conditioner</label>
                <input type="checkbox" value="monitor"> Monitor</label>
                <input type="checkbox" value="computer"> Computer</label>
                <input type="checkbox" value="whiteboard"> White Board</label>

            </div>
        </div>
        </div>

        <div>
            <h2>Add Schedules</h2>
        </div>

        <div class="roomform_container">

            <div class="form-group">
                <label>Block:</label>
                <select name="block">
                    <option value="A">1</option>
                    <option value="B">2</option>
                    <option value="C">3</option>
                    <option value="C">4</option>
                    <option value="C">5</option>
                    <option value="C">6</option>
                </select><br/>
            </div>

            <div class="form-group">
                <label>Date</label><br/>
                <input type="date" name="date" required><br/>
            </div>

        
            <div class="form-group">
                <label>Time</label>
                <div class="form-group-horizontal">
                <div class="time">
                    <label>start time</label><br/>
                    <input type="time" name="timeStart" required>
                </div>
               
                <div class="time">
                    <label>end time</label><br/>
                    <input type="time" name="timeEnd" required>
                    </div>
                </div>
                
            </div>

            <div class="form-group">
                <label>Day</label>
                <select>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                </select><br/>
        </div>
        <button type="submit" class="addanotherbtn">+</button> Add another<br/>
        <button type="submit" class="createbtn">Create</button>
        </div>
        
    </form>
</body>
</html>
