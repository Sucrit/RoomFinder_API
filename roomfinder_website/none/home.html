<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>University Room Finder</title>
    <link rel="stylesheet" href="../assets/style/homess.css" >
    
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="logo-container">
            <img src="../assets/images/appLogo.png" alt="upang logo" class="logo">
            <span class="roomsearchTxt">UPang Room Search</span>
        </div>

        <a href="#" class="nav-item">
            <img src="../assets/images/dashboardIcon.png">
            Dashboard
        </a>
        
        <a href="#" class="nav-item">
            <img src="../assets/images/room.png">
            Rooms
        </a>
        
        <a href="#" class="nav-item" onclick="showSection('settings')">
            <img src="../assets/images/account.png">
            Account
        </a>

        <div class="dropdown" >
            <div class="dropdown-toggle">
                <img src="../assets/images/requestIcon.png" alt="room-schedules Icon">

                Room Request
            </div>
            <div class="dropdown-menu">
                <a href="#" id="dropdown-item" onclick="showSection('pending_request')">Pending Request</a>
                <a href="#" id="dropdown-item" onclick="showSection('request_history')">Request History</a>    
            </div>
        </div>

        <div class="dropdown" >
            <div class="dropdown-toggle">
                <img src="../assets/images/roomscheduleIcon.png" alt="room-schedules Icon">
                Room Schedules
            </div>
            <div class="dropdown-menu">
                <a href="#" id="dropdown-item" onclick="showSection('ongoing_schedule')">On-going Schedule</a>
                <a href="#" id="dropdown-item" onclick="showSection('room_schedules')">Room Schedules</a>  
            </div>
        </div>

        <div class="dropdown" >
            <div class="dropdown-toggle">
                <img src="../assets/images/authIcon.png" alt="Auth Icon">
                Authentication
            </div>
            <div class="dropdown-menu">
                <a href="#" id="dropdown-item"  onclick="showSection('adduser')">Add user</a>
                <a href="#" id="dropdown-item" onclick="showSection ('userslists')">List of Users</a>
            </div>
        </div>

        <a href="login.html" class="logoutBtn">
            <img src="assets/images/logoutIcon.png" alt="Logout Icon">
            Logout
        </a>

    </div> 

        <script src="../activity/navbarActivity.js" defer></script>
        <script src="../activity/modalActivity.js"></script>
        <script src="../activity/profileActivity.js"></script>
        <script src="../activity/dashboardActivity.js" type="module"></script>
        <script src="../activity/roomrequestActivity.js" type="module"></script>
</body>
</html>
